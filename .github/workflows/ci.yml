name: CI

on:
  push:
    branches: [main]
  # Also validate stacked PRs whose base is another review branch.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build every workspace before resolving workspace package exports. The benchmark
      # manifest imports each first-party plugin by package name, so a core-only build
      # leaves their dist/type entrypoints absent in a clean checkout.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # Reuse this Ubuntu/Node 24 build for the in-memory manifest budget gate.
      # The final Build status still depends on this job and every test matrix cell.
      - run: pnpm manifest:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests import the benchmark manifest, which imports every first-party plugin by
      # package name. Build all workspace exports before starting Vitest.
      - run: pnpm build
      - run: pnpm test

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage loads the same workspace package entrypoints as the test job.
      - run: pnpm build
      # Fails when line/branch/statement/function coverage drops below the floors in
      # vitest.config.ts, so the token-economy and correctness suites can't silently decay.
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: ${{ always() }}
    steps:
      # Keep Build fail-closed when an upstream gate fails, skips or is cancelled.
      # lint-and-typecheck has already built and checked the manifest; test owns all six cells.
      - name: Require the build, manifest and test gates
        env:
          LINT_RESULT: ${{ needs.lint-and-typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
