name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build every workspace before resolving workspace package exports. The benchmark
      # manifest imports each first-party plugin by package name, so a core-only build
      # leaves their dist/type entrypoints absent in a clean checkout.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests import the benchmark manifest, which imports every first-party plugin by
      # package name. Build all workspace exports before starting Vitest.
      - run: pnpm build
      - run: pnpm test

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage loads the same workspace package entrypoints as the test job.
      - run: pnpm build
      # Fails when line/branch/statement/function coverage drops below the floors in
      # vitest.config.ts, so the token-economy and correctness suites can't silently decay.
      - run: pnpm test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Manifest budget gate (ADR-021): measures the host-visible tools/list payload for every
      # committed variant against packages/bench/fixtures/manifest-baseline.json and fails on
      # unreviewed BPE growth over 3%. In-memory MCP only — no Electron binary, no display — so
      # it belongs in this job rather than the e2e workflow.
      - run: pnpm manifest:check
